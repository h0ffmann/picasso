# A pushed v* tag (`just release`, scripts/release.sh) becomes a published GitHub release with
# WHITEPAPER.pdf and PICASSOPAPER.pdf attached; Zenodo's own webhook then archives it with
# .zenodo.json and mints the version DOI, once the repository is switched on at zenodo.org/account/settings/github. No secret:
# the webhook is Zenodo's, and GITHUB_TOKEN creates the release.
# The tag cannot deploy Pages itself (the github-pages environment only takes main), so the last
# step dispatches pages.yml on main, which builds the version badge and changelog from the tags.
# A release made with GITHUB_TOKEN starts no other workflow, so threads.yml is dispatched too.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: the tag is MAJOR.MINOR.PATCH and on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix run ./tools#citation -- --check
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" WHITEPAPER.pdf PICASSOPAPER.pdf --repo "$GITHUB_REPOSITORY" --verify-tag \
            --generate-notes --title "picasso $GITHUB_REF_NAME"
      - name: redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: announce the release on Threads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run threads.yml --repo "$GITHUB_REPOSITORY" --ref main -f release="$GITHUB_REF_NAME"
