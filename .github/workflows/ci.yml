# CI on GitHub-hosted runners (ubuntu-latest) — no self-hosted runner involved.
#
# Two kinds of file live in this repo and get two kinds of check:
#   - the NixOS system at the root: evaluation only (`nix flake check --no-build`), because
#     building a whole system toplevel is neither cheap nor useful on a runner;
#   - labs/<lab>: each is a self-contained flake that is actively developed, so it gets the
#     full gate — flake eval plus every `checks.*` output BUILT (pratico's is the WW3 toolchain
#     smoke test: Fortran + MPI + NetCDF-4 compiled and run in the sandbox), nixpkgs-fmt,
#     statix, deadnix, shellcheck, justfile parse, and the scripts' own self-tests. devShells
#     are evaluated, not built, so ai-jail (a Rust compile) and ParMETIS never build here.
#
# No run on pull requests, to save runner time: the gate runs after the merge, on main.
# labs/ptbr-pdf compiles Typst from source, so it runs only on workflow_dispatch.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nixos-eval:
    name: NixOS flake evaluates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: nix flake check (evaluate only)
        run: nix flake check --no-build --no-update-lock-file --print-build-logs .

  labs:
    name: labs/${{ matrix.lab }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab: ${{ fromJSON(github.event_name == 'workflow_dispatch'
          && '["pratico", "publisher", "ptbr-pdf", "lint", "paper", "gleam-website", "agentic", "cuda", "present", "viz"]'
          || '["pratico", "publisher", "lint", "paper", "gleam-website", "agentic", "cuda", "present", "viz"]') }}
    defaults:
      run:
        working-directory: labs/${{ matrix.lab }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23

      # checks.lab-json asserts lab.json's shape and resolves every headline attribute.
      - name: nix flake check (devShells evaluate, checks build; lock must be current)
        run: nix flake check --no-update-lock-file --print-build-logs .

      # Lint tools come from the lab's own locked nixpkgs, so CI and `nix develop` agree and
      # there is no second nixpkgs download.
      - name: resolve the lab's pinned nixpkgs
        id: pin
        run: |
          rev="$(nix flake metadata --json --no-update-lock-file . | jq -r '.locks.nodes.nixpkgs.locked.rev')"
          echo "nixpkgs=github:NixOS/nixpkgs/$rev" >> "$GITHUB_OUTPUT"

      - name: nixpkgs-fmt --check
        run: nix run '${{ steps.pin.outputs.nixpkgs }}#nixpkgs-fmt' -- --check .
      - name: statix
        run: nix run '${{ steps.pin.outputs.nixpkgs }}#statix' -- check .
      - name: deadnix
        run: nix run '${{ steps.pin.outputs.nixpkgs }}#deadnix' -- --fail .
      - name: shellcheck (every *.sh in the lab; layout differs per lab)
        run: |
          mapfile -t files < <(find . \( -name '*.sh' -o -path './scripts/*' -type f -perm -u+x \) -not -path './result*' | sort)
          if [ "${#files[@]}" -eq 0 ]; then echo "no shell scripts in this lab"; exit 0; fi
          nix run '${{ steps.pin.outputs.nixpkgs }}#shellcheck' -- "${files[@]}"
      - name: justfile parses
        run: nix run '${{ steps.pin.outputs.nixpkgs }}#just' -- --list
      - name: script self-tests (every executable under scripts/ that has a --self-test mode)
        run: |
          ran=0
          for s in scripts/*; do
            if [ -x "$s" ] && grep -q -- '--self-test)' "$s"; then PATH="$PWD/scripts:$PATH" "$s" --self-test; ran=1; fi
          done
          [ "$ran" -eq 1 ] || echo "no self-tests in this lab"

  ubuntu-just:
    # The justfiles must run with the `just` that apt installs on Ubuntu LTS, not only with
    # nixpkgs' newer one: the root justfile used `[group]` and broke on 24.04's just 1.21.
    name: justfiles parse with Ubuntu's just
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -y -q just && just --version
      - name: every justfile parses
        run: |
          git ls-files -z '*justfile' | while IFS= read -r -d '' f; do
            echo "== $f"
            just --justfile "$f" --working-directory "$(dirname "$f")" --summary
          done

  # Licence and copyright of every file come from REUSE.toml and LICENSES/ (REUSE 3.3).
  reuse:
    name: licences (REUSE)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: pipx run reuse==5.0.2 lint

  # docs/social: every Instagram post has a valid status (DESIGN, REVIEW or POSTED), and
  # tools/social, which posts to Threads, passes its self-test (docs/adr/0001).
  social:
    name: social posts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix run ./tools#social -- --self-test
      - run: nix run ./tools#social -- check

  # .claude/skills/ouroboric-sharingan: the licence scanner and the benchmark runner's self-tests
  # (no model calls; the benchmark itself runs by hand, evals/BENCHMARK.md).
  skills:
    name: skills self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: cargo test, in the Nix sandbox
        run: nix build --no-link --no-update-lock-file --print-build-logs ./tools#checks.x86_64-linux.tests

  # tools/: the Rust crates CI, the justfiles and the site call. Not a lab (the sharingan, social
  # and zenodo tests read files elsewhere in the repo), so it has its own job: `checks` build the
  # workspace with its tests, clippy -D warnings and cargo fmt --check.
  tools:
    name: tools (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: nix flake check (lock must be current)
        run: nix flake check --no-update-lock-file --print-build-logs .
      - name: resolve the pinned nixpkgs
        id: pin
        run: |
          rev="$(nix flake metadata --json --no-update-lock-file . | jq -r '.locks.nodes.nixpkgs.locked.rev')"
          echo "nixpkgs=github:NixOS/nixpkgs/$rev" >> "$GITHUB_OUTPUT"
      - run: nix run '${{ steps.pin.outputs.nixpkgs }}#nixpkgs-fmt' -- --check .
      - run: nix run '${{ steps.pin.outputs.nixpkgs }}#statix' -- check .
      - run: nix run '${{ steps.pin.outputs.nixpkgs }}#deadnix' -- --fail .

  actionlint:
    name: workflows lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix run nixpkgs#actionlint

  # The Gleam site: format, unit tests, the build, and site-check's hard rules on the built page.
  site:
    name: site rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: nix flake check (lock must be current)
        run: nix flake check --no-update-lock-file --print-build-logs .
      - name: nixpkgs-fmt --check
        run: nix run nixpkgs#nixpkgs-fmt -- --check flake.nix
      - name: just ci
        run: nix develop --no-update-lock-file -c just ci
