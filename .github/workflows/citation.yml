# The citation metadata Zenodo and GitHub read: .zenodo.json valid against Zenodo's vocabularies,
# CITATION.cff generated from it (tools/citation, ported from the script copied from marola-dev/marola), then the CFF
# checked by the Citation File Format project's own validator.
name: citation

on:
  push:
    branches: [main]
    paths: [CITATION.cff, .zenodo.json, tools/citation/**]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix run ./tools#citation -- --self-test
      - run: nix run ./tools#citation -- --check
      - uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: --validate
