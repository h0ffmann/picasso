version = 1

# Licence and copyright for every file, in one place, as the ouroboric-dev repositories do: no
# per-file headers. Code is AGPL-3.0-only, prose and media CC BY 4.0 (README, License); releases up
# to v0.1.1 stay MIT. Check with `reuse lint` (CI's `reuse` job). Anything third-party that lands
# here gets an entry below and its row in the README's License table.

[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Matheus Hoffmann"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["**/*.md", "docs/**", "notes/**", "*.pdf", "site/static/drawings/**", "site/static/plan/**", "site/screenshots/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Matheus Hoffmann"
SPDX-License-Identifier = "CC-BY-4.0"

# The papers' render scripts and build image are code, though they sit under docs/.
[[annotations]]
path = ["docs/**/*.mjs", "docs/**/*.nix", "docs/**/.gitignore"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Matheus Hoffmann"
SPDX-License-Identifier = "AGPL-3.0-only"

# Vendored skills keep their upstream licence (.claude/skills/README.md); the one-note change
# under each front matter is mine and follows the same licence.

[[annotations]]
path = [".claude/skills/ultimate-nixos/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Aleksandar Nesovic", "2026 Matheus Hoffmann"]
SPDX-License-Identifier = "MIT"

[[annotations]]
