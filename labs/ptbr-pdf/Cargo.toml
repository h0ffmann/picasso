[package]
name = "to-pdf"
version = "0.1.0"
edition = "2021"
description = "Markdown to PDF for pt-BR text, with Typst as a library"
license = "AGPL-3.0-only"
publish = false

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
typst = "0.15"
typst-as-lib = { version = "0.17", default-features = false }
typst-layout = "0.15"
typst-pdf = "0.15"

[dev-dependencies]
insta = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
