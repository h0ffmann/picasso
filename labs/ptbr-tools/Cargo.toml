[package]
name = "ptbr-tools"
version = "0.1.0"
edition = "2021"
description = "The runtime scripts of the ptbr-writer plugin, as small static binaries"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "ptbr_tools"
path = "src/lib.rs"

[[bin]]
name = "ptbr"
path = "src/bin/ptbr.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
